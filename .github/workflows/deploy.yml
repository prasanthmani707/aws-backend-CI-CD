name: Deploy Environment Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'lambda-function/Environment_creation_creditbased/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create ZIP
        run: |
          cd lambda-function/Environment_creation_creditbased
          zip -r function.zip .

      - name: Deploy Existing Lambda
        run: |
          aws lambda update-function-code \
            --function-name Environment_creation_creditbased \
            --zip-file fileb://lambda-function/Environment_creation_creditbased/function.zip