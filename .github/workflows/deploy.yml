name: Deploy Changed Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Changed Lambda Folders
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^lambda-function/' | cut -d/ -f2 | sort -u)

          echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT

          echo "Changed folders:"
          echo "$CHANGED"

      - name: Deploy Changed Lambdas
        run: |
          for folder in ${{ steps.changed.outputs.changed_folders }}
          do
            echo "Deploying $folder"

            cd lambda-function/$folder

            zip -r function.zip .

            aws lambda update-function-code \
              --function-name $folder \
              --zip-file fileb://function.zip

            cd ../../
          done