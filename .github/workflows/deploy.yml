name: Deploy Environment Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'lambda-function/Environment_creation_creditbased/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Changed Folders
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | cut -d/ -f2 | uniq)
          echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT

      - name: Deploy Changed Lambdas
        run: |
          for folder in ${{ steps.changed.outputs.changed_folders }}
          do
            echo "Deploying $folder"

            cd lambda-function/$folder

            zip -r function.zip .

            aws lambda update-function-code \
              --function-name $folder \
              --zip-file fileb://function.zip

            cd ../../
          done