name: Deploy Changed Lambda

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials for Dev
        if: github.ref_name == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS Credentials for Prod
        if: github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Changed Lambda Folders
        id: changed
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | awk -F/ '/^lambda-function\/[^/]+\// {print $2}' \
            | sort -u \
            | tr '\n' ' ')

          echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT

          echo "Changed folders:"
          echo "$CHANGED"

      - name: Deploy Changed Lambdas
        if: steps.changed.outputs.changed_folders != ''
        run: |
          for folder in ${{ steps.changed.outputs.changed_folders }}
          do
            path=$(jq -r --arg folder "$folder" '.functions[$folder].path // empty' .github/lambda-deploy-map.json)
            function_name=$(jq -r --arg folder "$folder" '.functions[$folder].functionName // empty' .github/lambda-deploy-map.json)
            enabled=$(jq -r --arg folder "$folder" 'if (.enabledFunctions // null) == null then "true" elif (.enabledFunctions | index($folder)) then "true" else "false" end' .github/lambda-deploy-map.json)

            if [ -z "$path" ] || [ -z "$function_name" ]; then
              echo "Skipping unmapped folder: $folder"
              continue
            fi

            if [ "$enabled" != "true" ]; then
              echo "Skipping disabled folder: $folder"
              continue
            fi

            if [ ! -d "$path" ]; then
              echo "Skipping deleted folder: $folder"
              continue
            fi

            echo "Deploying $folder to Lambda $function_name"

            cd "$path"

            zip -r function.zip . \
              -x ".env" \
              -x "*.env" \
              -x "*__pycache__/*" \
              -x "*.pyc" \
              -x "*_details.json" \
              -x "*.zip"

            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file fileb://function.zip

            cd "$GITHUB_WORKSPACE"
          done
