name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'Environment_creation_creditbased/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          cd Environment_creation_creditbased
          pip install -r requirements.txt -t .

      - name: Create ZIP
        run: |
          cd Environment_creation_creditbased
          zip -r function.zip .

      - name: Deploy to Existing Lambda
        run: |
          aws lambda update-function-code \
            --function-name Environment_creation_creditbased \
            --zip-file fileb://Environment_creation_creditbased/function.zip